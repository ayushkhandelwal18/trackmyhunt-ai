<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track job applications, manage your opportunities, analyze your resume against job descriptions, and stay organized throughout your job search." />
    <meta property="og:title" content="TrackMyHunt — Organize Your Job Hunt" />
    <meta property="og:description" content="Track job applications, manage your opportunities, analyze your resume against job descriptions, and stay organized throughout your job search." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0c0c0d" />
    <title>TrackMyHunt — Organize Your Job Hunt</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tmh-theme");
          var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
