# TrackMyHunt Reminders — hourly scheduler for the existing reminder system.
#
# Runs backend/scripts/send-reminders.js (npm run reminders), which executes
# runReminderCycle() from backend/services/reminder.service.js. The script
# itself decides whether any reminder is eligible; most runs send nothing.
# Sends are idempotent (claimed markers + unique indexes), so overlapping
# or repeated runs can never deliver a duplicate email.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, RESEND_API_KEY, RESEND_FROM_EMAIL, RESEND_FROM_NAME, CLIENT_URL

name: TrackMyHunt Reminders

on:
  schedule:
    # Once every hour. The reminder service evaluates eligibility each run;
    # an email is sent only when a reminder is actually due.
   - cron: "30 * * * *"
  workflow_dispatch: # Manual run from the Actions tab for testing.

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || vars.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || vars.RESEND_FROM_EMAIL }}
      RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME || vars.RESEND_FROM_NAME }}
      CLIENT_URL: ${{ secrets.CLIENT_URL || vars.CLIENT_URL }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Skip run when database config is missing
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "::warning::DATABASE_URL is not configured. Skipping reminder cycle."

      - name: Install backend dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: npm ci

      - name: Run reminder cycle
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run reminders