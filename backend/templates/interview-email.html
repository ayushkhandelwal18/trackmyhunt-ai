<!doctype html>
<html>
  <!--
    TrackMyHunt Interview Reminder
    Resend variables (all mapped from backend/services/reminder.service.js processUserInterviews):
    - subject      -> email subject line (set as the message subject, not rendered in the body)
    - user_name    -> recipient's name
    - heading      -> reminder heading text
    - message_html -> pre-rendered HTML list of upcoming interviews (rendered unescaped)
    - cta_url      -> "View Applications" link target
  -->
  <body style="margin:0;padding:24px;background:#f5f5f4;">
    <div style="font-family:Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e7e5e4;border-radius:10px;padding:28px;color:#222222;">
      <div style="font-weight:800;font-size:16px;color:#0c0a09;">&#9678; TrackMyHunt</div>
      <h1 style="font-size:18px;margin:16px 0 8px;">{{heading}}</h1>
      <p style="font-size:14px;color:#555555;">Hi {{user_name}},</p>
      <div style="font-size:14px;">{{{message_html}}}</div>
      <p style="margin-top:22px;">
        <a href="{{cta_url}}" style="display:inline-block;background:#ea580c;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;font-size:14px;">View Applications</a>
      </p>
      <p style="font-size:12px;color:#999999;margin-top:20px;">
        Times are shown exactly as you saved them. You're receiving this because
        email reminders are enabled in your TrackMyHunt profile.
      </p>
    </div>
  </body>
</html>
